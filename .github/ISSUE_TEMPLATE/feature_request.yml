name: Feature request
description: Suggest an idea or a workflow cfa should support
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Commands, flags or behaviour you'd like. Examples help.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives / workarounds you've tried
