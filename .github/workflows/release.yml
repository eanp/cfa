name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check version matches tag
        run: |
          want="${GITHUB_REF_NAME#v}"
          have=$(bin/cfa --version | awk '{print $2}')
          if [ "$want" != "$have" ]; then
            echo "::error::tag $GITHUB_REF_NAME but bin/cfa says $have"; exit 1
          fi
      - name: Test
        run: |
          sudo apt-get update && sudo apt-get install -y bats zsh fish shellcheck
          make check
      - name: Extract release notes
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          cat notes.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp bin/cfa cfa
          sha256sum cfa > cfa.sha256
          gh release create "$GITHUB_REF_NAME" cfa cfa.sha256 \
            --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
